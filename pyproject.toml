[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-bot"
version = "0.1.0"
description = "CLI Python para captura, transcrição e geração automática de resumos de reuniões"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Claude Code", email = "noreply@anthropic.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0.0",
    "pyaudio>=0.2.14",
    "sounddevice>=0.4.7",
    "ffmpeg-python>=0.2.0",
    "faster-whisper>=1.0.0",
    "anthropic>=0.3.0",
    "python-docx>=0.8.11",
    "weasyprint>=60.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
meeting-bot = "meeting_bot.cli:main"

[project.urls]
Homepage = "https://github.com/carnevali/meeting-bot"
Repository = "https://github.com/carnevali/meeting-bot"

[tool.setuptools.packages.find]
where = ["."]
include = ["meeting_bot*"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]